<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Mandatório</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Acompanhe a atuação do Presidente da República e dos senadores: votos, presença, gastos, medidas provisórias e vetos.">
  <meta name="theme-color" content="#0e6b5c">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mandatório">
  <script>try{var t=localStorage.getItem("mt-tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root>
    <!-- Abertura: aparece enquanto o app carrega e é trocada pelo Angular quando ele inicia. -->
    <style>
      .abertura { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; background: #fff; color: #0f1e1b; font-family: system-ui, sans-serif; }
      .abertura__marca { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
      .abertura__cupula { width: 34px; height: 30px; border-radius: 17px 17px 4px 4px; background: #0e6b5c; animation: abertura-pulsar 1.1s ease-in-out infinite; }
      .abertura__texto { font-size: 14px; color: #4d605b; }
      @keyframes abertura-pulsar { 0%, 100% { opacity: .4; transform: scale(.9); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .abertura__cupula { animation: none; } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .abertura { background: #0f1a18; color: #e8f0ee; } :root:not([data-theme="light"]) .abertura__cupula { background: #4cc2ac; } :root:not([data-theme="light"]) .abertura__texto { color: #a3b5b0; } }
      :root[data-theme="dark"] .abertura { background: #0f1a18; color: #e8f0ee; }
      :root[data-theme="dark"] .abertura__cupula { background: #4cc2ac; }
      :root[data-theme="dark"] .abertura__texto { color: #a3b5b0; }
    </style>
    <div class="abertura" role="status" aria-live="polite">
      <div class="abertura__marca"><span class="abertura__cupula" aria-hidden="true"></span>mandatório</div>
      <div class="abertura__texto">Carregando…</div>
    </div>
  </app-root>
</body>
</html>
